<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#7c3aed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icons/archive-192.png">
<title>Archive — دخول الإدارة</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       background:linear-gradient(135deg,#0b0b14,#15151c);color:#f5f5f7;
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",Cairo,Tajawal,sans-serif}
  .card{width:min(420px,92vw);background:#1c1c26;border:1px solid #2a2a36;
        border-radius:18px;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  h1{margin:0 0 4px;font-size:22px}
  .sub{color:#9b9bab;margin:0 0 22px;font-size:13px}
  .api-box{margin:0 0 16px;padding:12px;border:1px solid #2e2e3c;border-radius:12px;background:#11111a}
  .api-box label{margin:0 0 6px;font-size:12px;color:#cfcfdc}
  .api-row{display:flex;gap:7px}.api-row input{min-width:0;padding:9px 10px;font-size:12px}.api-row button{width:auto;margin:0;padding:9px 12px;font-size:12px;white-space:nowrap}
  .api-help{display:block;margin-top:7px;color:#7a7a8d;font-size:11px;line-height:1.5}
  label{display:block;font-size:13px;margin:14px 0 6px;color:#cfcfdc}
  input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #2e2e3c;
        background:#0f0f17;color:#fff;font:inherit;outline:none}
  input:focus{border-color:#06b6d4;box-shadow:0 0 0 3px rgba(6,182,212,.18)}
  button{margin-top:20px;width:100%;padding:12px 14px;border:0;border-radius:12px;
         background:linear-gradient(135deg,#7c3aed,#06b6d4,#f97316);color:#fff;font-weight:600;cursor:pointer;font-size:15px}
  button[disabled]{opacity:.6;cursor:not-allowed}
  .err{margin-top:14px;color:#ff8a93;font-size:13px;min-height:18px}
  .foot{margin-top:20px;text-align:center;font-size:12px;color:#7a7a8d}
</style>
</head>
<body>
  <form class="card" id="f" autocomplete="off">
    <h1>Archive · لوحة الإدارة</h1>
    <p class="sub">يجب تسجيل الدخول للوصول إلى أي عملية إدارية.</p>
    <div class="api-box">
      <label for="api-origin">عنوان خادم API</label>
      <div class="api-row"><input id="api-origin" type="url" inputmode="url" placeholder="https://خادم-archive.example"><button id="save-api" type="button">حفظ وتجربة</button></div>
      <small class="api-help">داخل APK لا يعني localhost خادمك. ضع عنوان خادم Archive المنشور أو عنوان جهازك في الشبكة، ثم اضغط حفظ وتجربة.</small>
    </div>
    <label for="u">اسم المستخدم</label>
    <input id="u" name="username" required minlength="3" maxlength="32" autocomplete="username">
    <label for="p">كلمة المرور</label>
    <input id="p" name="password" type="password" required minlength="12" maxlength="256" autocomplete="current-password">
    <button id="btn" type="submit">دخول</button>
    <div id="err" class="err" role="alert" aria-live="polite"></div>
    <div class="foot">جميع المحاولات يتم تسجيلها مع IP و User-Agent.</div>
  </form>
<script src="/api-config.js"></script>
<script>
const API = (window.__ARCHIVE_API__ || window.__API__ || location.origin).replace(/\/+$/,'');
const apiInput = document.getElementById('api-origin');
if (apiInput) apiInput.value = API === location.origin ? '' : API;
function validApiOrigin(value) {
  try {
    const u = new URL(value);
    if (!['http:', 'https:'].includes(u.protocol)) return false;
    if (u.protocol === 'http:' && !/^(localhost|127\\.0\\.0\\.1|10\\.0\\.2\\.2)$/i.test(u.hostname)) return false;
    return !u.pathname || u.pathname === '/';
  } catch { return false; }
}
document.getElementById('save-api')?.addEventListener('click', () => {
  const value = apiInput?.value.trim().replace(/\\/+$/,'') || '';
  if (!validApiOrigin(value)) { document.getElementById('err').textContent = 'اكتب عنوان API صحيحًا؛ HTTPS مطلوب للخادم المنشور.'; return; }
  localStorage.setItem('archive_api_url', value);
  window.location.reload();
});
(async () => {
  // Bootstrap CSRF token
  let csrf = '';
  try {
    const r = await fetch(API + '/api/csrf', { credentials: 'include', cache: 'no-store' });
    csrf = (await r.json()).csrfToken || '';
  } catch {}

  const f = document.getElementById('f');
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true; btn.textContent = 'جاري التحقق...';
    try {
      const r = await fetch(API + '/api/admin/auth/login', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf },
        body: JSON.stringify({
          username: document.getElementById('u').value.trim(),
          password: document.getElementById('p').value,
        }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'فشل تسجيل الدخول');
      // Store access token and the current CSRF token returned by the server.
      sessionStorage.setItem('admin_access', d.accessToken);
      sessionStorage.setItem('admin_csrf', d.csrfToken || csrf);
      window.location.replace('/admin.html');
    } catch (e) {
      err.textContent = e.message === 'BAD_CREDENTIALS'
        ? 'بيانات الدخول غير صحيحة.'
        : (e.message === 'AUTH_RATE_LIMIT'
            ? 'محاولات كثيرة. حاول بعد دقيقة.'
            : 'تعذّر تسجيل الدخول.');
    } finally {
      btn.disabled = false; btn.textContent = 'دخول';
    }
  });
})();
</script>
</body>
</html>
