  el: $('#fap'), audio: null, ctx: null, analyser: null, src: null, raf: 0,
  playing: false, playlist: [], idx: 0,
  open(track, list){
    if (list) { this.playlist = list; this.idx = Math.max(0, list.findIndex(t=>t.url===track.url)); }
    else { this.playlist = [track]; this.idx = 0; }
    this.load(track);
    this.el.classList.add('show');
  },
  async load(t){
    const native = window.archiveNativeAudio;
    $('#fap-title').textContent = t.title||'—';
    $('#fap-artist').textContent = t.artist||'';
    $('#fap-cover').style.background = t.cover?`url('${t.cover}') center/cover`:'linear-gradient(135deg,#111111,#555555)';
    this.updateMini();

    if (native?.available) {
      try {
        if (this.audio) { this.audio.pause(); this.audio = null; }
        this.nativeId = true;
        native.onComplete = () => this.next();
        native.onState = event => {
          if (event && typeof event.isPlaying === 'boolean') {
            this.playing = event.isPlaying;
            this.setIcon(); this.syncMiniIcon();
            $('#fap-cover').classList.toggle('spin', this.playing);
          }
        };
        await native.play({
          url: normalizeMediaUrl(t.url, { type:'audio' }),
          title: t.title || 'تشغيل صوتي',
          artist: t.artist || 'Archive',
          cover: t.cover || '',
        });
        this.playing = true; this.setIcon(); this.syncMiniIcon(); $('#fap-cover').classList.add('spin');
        clearInterval(this.nativeTimer);
        this.nativeTimer = setInterval(async () => {
          if (!this.nativeId) return;
          const p = await native.position();
          const cur = Number(p.currentTime || 0), dur = Number(p.duration || 0);
          $('#fap-cur').textContent = this.fmt(cur); $('#fap-dur').textContent = this.fmt(dur);
          $('#fap-played').style.transform = `scaleX(${dur ? cur/dur : 0})`;
          const mp = document.getElementById('mini-prog'); if (mp) mp.style.width = (dur ? cur/dur*100 : 0) + '%';
        }, 500);
        return;
      } catch (e) {
        console.warn('native audio unavailable', e);
        this.nativeId = false;
        toast('تعذر تشغيل المشغل الأصلي؛ جارٍ استخدام المشغل العادي','error');
      }
    }

    if (!this.audio){
      this.audio = new Audio();
      this.audio.crossOrigin = 'anonymous';
      this.audio.addEventListener('timeupdate', () => this.tick());
      this.audio.addEventListener('loadedmetadata', () => this.tick());
      this.audio.addEventListener('ended', () => this.next());
      this.audio.addEventListener('play',  () => { this.playing=true; this.setIcon(); this.syncMiniIcon(); $('#fap-cover').classList.add('spin'); this.startViz(); });
      this.audio.addEventListener('pause', () => { this.playing=false; this.setIcon(); this.syncMiniIcon(); $('#fap-cover').classList.remove('spin'); });
      this.audio.addEventListener('error', () => toast('فشل تشغيل الأنشودة','error'));
    }
    this.nativeId = false;
    this.audio.src = normalizeMediaUrl(t.url, { type:'audio' });
    this.audio.play().catch(()=>{});
    this.updateMini();
  },
  setIcon(){
    $('#fap-play').innerHTML = this.playing
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  },
  fmt(t){ if(!isFinite(t)) return '0:00'; const m=Math.floor(t/60), s=Math.floor(t%60); return `${m}:${s<10?'0':''}${s}`; },
  tick(){
    if (!this.audio) return;
    const d = this.audio.duration||0, c = this.audio.currentTime||0;
    $('#fap-cur').textContent = this.fmt(c);
    $('#fap-dur').textContent = this.fmt(d);
    $('#fap-played').style.transform = `scaleX(${d?c/d:0})`;
    const mp = document.getElementById('mini-prog'); if (mp) mp.style.width = (d?(c/d)*100:0) + '%';
  },
  prev(){
    if (this.idx > 0) { this.idx--; this.load(this.playlist[this.idx]); }
    else if (this.nativeId) { window.archiveNativeAudio.seek(0).catch(()=>{}); }
    else if (this.audio) { this.audio.currentTime = 0; }
  },
  next(){
    if (this.repeat) {
      if (this.nativeId) this.load(this.playlist[this.idx]);
      else if (this.audio) { this.audio.currentTime = 0; this.audio.play().catch(()=>{}); }
      return;
    }
    if (this.idx < this.playlist.length-1) { this.idx++; this.load(this.playlist[this.idx]); }
    else if (this.nativeId) { this.stop(); }
    else if (this.audio) { this.audio.pause(); }
  },
  toggleRepeat(){ this.repeat = !this.repeat; this.syncRepeatUI(); },
  syncRepeatUI(){
    const a = document.getElementById('fap-repeat'); if (a) a.classList.toggle('on', !!this.repeat);
  },
  download(){
    const t = this.playlist[this.idx]; if (!t || !t.url) return;
    try {
      const a = document.createElement('a');
      // Direct URL — let the browser stream/save it. normalizeMediaUrl proxies remote URLs so headers are correct.
      a.href = normalizeMediaUrl(t.url, { type:'audio' });
      a.download = (t.title || 'audio').replace(/[\\/:*?"<>|]+/g,'_');
      a.target = '_blank'; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      try { toast('بدأ التنزيل','success'); } catch(_){}
    } catch(e){ try { toast('فشل التنزيل','error'); } catch(_){} }
  },
  minimize(){ this.el.classList.remove('show'); /* audio keeps playing; mini bar stays */ },
  stop(){
    this.el.classList.remove('show');
    if (this.nativeId) {
      window.archiveNativeAudio.stop().catch(()=>{});
      this.nativeId = false;
      clearInterval(this.nativeTimer);
    }
    if (this.audio){ this.audio.pause(); this.audio.currentTime = 0; }
    this.playing = false; this.setIcon(); this.syncMiniIcon();
    cancelAnimationFrame(this.raf);
    const m = document.getElementById('mini-ap'); if (m) m.classList.remove('show');
    document.body.classList.remove('has-mini');
  },
  updateMini(){
    const t = this.playlist[this.idx]; if (!t) return;
    const m = document.getElementById('mini-ap'); if (!m) return;
    m.classList.add('show'); document.body.classList.add('has-mini');
    document.getElementById('mini-title').textContent = t.title || '—';
    document.getElementById('mini-artist').textContent = t.artist || '';
    document.getElementById('mini-cover').style.background = t.cover ? `url('${t.cover}') center/cover` : 'linear-gradient(135deg,#111111,#555555)';
    this.syncMiniIcon();
  },
  syncMiniIcon(){
    const b = document.getElementById('mini-play'); if (!b) return;
    b.innerHTML = this.playing
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  },
  startViz(){
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      if (!this.src) {
        this.src = this.ctx.createMediaElementSource(this.audio);
        this.analyser = this.ctx.createAnalyser();
        this.analyser.fftSize = 128;
        this.src.connect(this.analyser);
        this.analyser.connect(this.ctx.destination);
      }
      const cv = $('#fap-canvas'); const c2 = cv.getContext('2d');
      const data = new Uint8Array(this.analyser.frequencyBinCount);
      const draw = () => {
        if (!this.playing) { c2.clearRect(0,0,cv.width,cv.height); cancelAnimationFrame(this.raf); return; }
        cv.width = cv.clientWidth; cv.height = cv.clientHeight;
        this.analyser.getByteFrequencyData(data);
        c2.clearRect(0,0,cv.width,cv.height);
        const bars = data.length, bw = cv.width/bars;
        for (let i=0;i<bars;i++){
          const h = (data[i]/255)*cv.height;
          const g = c2.createLinearGradient(0, cv.height-h, 0, cv.height);
          g.addColorStop(0,'#111111'); g.addColorStop(1,'#777777');
          c2.fillStyle = g;
          c2.fillRect(i*bw+1, cv.height-h, bw-2, h);
        }
        this.raf = requestAnimationFrame(draw);
      };
      draw();
    } catch(e){ console.warn('viz', e); }
  },
  close(){ this.minimize(); }
};
window.fap = fap;
$('#fap-close').addEventListener('click', () => fap.close());
$('#fap-play').addEventListener('click', () => {
  if (fap.nativeId) { fap.playing ? window.archiveNativeAudio.pause() : window.archiveNativeAudio.resume(); return; }
  if (fap.audio) fap.audio.paused ? fap.audio.play() : fap.audio.pause();
});
$('#fap-back').addEventListener('click', () => {
  if (fap.nativeId) window.archiveNativeAudio.position().then(p => window.archiveNativeAudio.seek(Math.max(0, Number(p.currentTime || 0)-10))).catch(()=>{});
  else if (fap.audio) fap.audio.currentTime = Math.max(0, fap.audio.currentTime-10);
});
$('#fap-fwd').addEventListener('click',  () => {
  if (fap.nativeId) window.archiveNativeAudio.position().then(p => window.archiveNativeAudio.seek(Math.min(Number(p.duration || 0), Number(p.currentTime || 0)+10))).catch(()=>{});
  else if (fap.audio) fap.audio.currentTime = Math.min(fap.audio.duration||0, fap.audio.currentTime+10);
});
(() => {
  const prog = $('#fap-prog');
  const seek = e => {
          if (fap.nativeId) {
        const r = prog.getBoundingClientRect();
        const x = (e.touches?e.touches[0]:e).clientX;
        let ratio = (x-r.left)/r.width;
        if (document.documentElement.dir==='rtl') ratio = 1-ratio;
        window.archiveNativeAudio.position().then(p => window.archiveNativeAudio.seek(Math.max(0, Math.min(1, ratio)) * Number(p.duration || 0))).catch(()=>{});
        return;
      }
      if (!fap.audio || !isFinite(fap.audio.duration)) return;

    const r = prog.getBoundingClientRect();
    const x = (e.touches?e.touches[0]:e).clientX;
    let ratio = (x-r.left)/r.width;
    if (document.documentElement.dir==='rtl') ratio = 1-ratio;
    ratio = Math.max(0,Math.min(1,ratio));
    fap.audio.currentTime = ratio*fap.audio.duration;
  };
  let down=false;
  prog.addEventListener('pointerdown', e=>{down=true;seek(e);prog.setPointerCapture(e.pointerId);});
  prog.addEventListener('pointermove', e=>{if(down) seek(e);});
  prog.addEventListener('pointerup',   ()=>{down=false;});
})();

/* ===== New player controls: repeat / download / prev / next / mini ===== */
(function(){
  const $r = id => document.getElementById(id);
  $r('fap-repeat')   && $r('fap-repeat').addEventListener('click', () => fap.toggleRepeat());
  $r('fap-download') && $r('fap-download').addEventListener('click', (e) => { e.stopPropagation(); fap.download(); });
  $r('fap-prev')     && $r('fap-prev').addEventListener('click', () => fap.prev());
  $r('fap-next')     && $r('fap-next').addEventListener('click', () => fap.next());

  // Mini bar interactions
  $r('mini-play')  && $r('mini-play').addEventListener('click', (e) => {
    e.stopPropagation();
    if (fap.nativeId) { fap.playing ? window.archiveNativeAudio.pause() : window.archiveNativeAudio.resume(); return; }
    if (!fap.audio) return;
    fap.audio.paused ? fap.audio.play() : fap.audio.pause();
  });
  $r('mini-prev')  && $r('mini-prev').addEventListener('click', (e) => { e.stopPropagation(); fap.prev(); });
  $r('mini-next')  && $r('mini-next').addEventListener('click', (e) => { e.stopPropagation(); fap.next(); });
  $r('mini-close') && $r('mini-close').addEventListener('click', (e) => { e.stopPropagation(); fap.stop(); });
  // Tap meta = expand to full screen
  $r('mini-meta')  && $r('mini-meta').addEventListener('click', () => {
    if (fap.playlist.length) fap.el.classList.add('show');
  });
})();

async function applyTheme(){
  try {
    const cfg = await fetch(API+'/api/app-config').then(r=>r.json()).catch(()=>null);
    applyBranding(cfg || {});
    applyFont(cfg || {});
    // Archive uses a deliberate monochrome visual system; remote theme colors are ignored.
    return;
    const r = document.documentElement.style;
    if (t.primary)     r.setProperty('--red', t.primary);
    if (t.primary2)    r.setProperty('--red-2', t.primary2);
    if (t.primaryDeep) r.setProperty('--red-deep', t.primaryDeep);
    if (t.primary && t.primary2 && t.primaryDeep){
      r.setProperty('--grad', `linear-gradient(135deg, ${t.primary} 0%, ${t.primary2} 50%, ${t.primaryDeep} 100%)`);
    }
    if (t.bg)      r.setProperty('--bg', t.bg);
    if (t.surface) r.setProperty('--surface', t.surface);
    if (t.text)    r.setProperty('--text', t.text);
    if (t.audioColor && t.audioColor2){
      // Recolour the green audio play button + full-screen audio player accents
      const css = `
        .play-green{background:linear-gradient(135deg, ${t.audioColor} 0%, ${t.audioColor2} 100%) !important}
        #fap .fap-ctrls .fap-play{background:linear-gradient(135deg, ${t.audioColor}, ${t.audioColor2}) !important}
        #fap .fap-prog-played{background:linear-gradient(90deg, ${t.audioColor}, ${t.audioColor2}) !important}
      `;
      let st = document.getElementById('theme-audio'); if (!st){ st = document.createElement('style'); st.id='theme-audio'; document.head.appendChild(st); }
      st.textContent = css;
    }
  } catch {}
}

async function checkAppStatus(){
  try {
    // Use admin endpoint (open, no signing) so the app respects the kill switch
    const r = await fetch(API+'/api/app-status').then(r=>r.json()).catch(()=>null);
    if (r && r.disabled){
      const hasUpdate = !!r.updateUrl;
      const defaultMsg = hasUpdate
        ? 'التطبيق متوقف من قبل المسؤول. يمكنك تحميل التحديث الجديد.'
        : 'تم إيقاف التطبيق بسبب عطل فني. سيتم إصلاحه قريباً إن شاء الله. شكراً لصبركم.';
      $('#blocked-msg').textContent = r.message || defaultMsg;
      const updateBtn = $('#blocked-update');
      if (hasUpdate){
        updateBtn.href = r.updateUrl;
        updateBtn.style.display='inline-block';
        updateBtn.textContent = 'تحميل التحديث';
      } else {
        updateBtn.style.display='none';
      }
      $('#blocked').style.display = 'flex';
      $('#splash').remove?.();
      $('#app').style.display='none';
      return true;
    }
  } catch {}
  return false;
}


/* ===== v4.2: render side-menu inline media items ===== */
(function(){
  // Periodic enhancement: when drawer renders, attach inline media list under each item.
  function enhanceDrawer(){
    const list = document.getElementById('drawer-list'); if (!list) return;
    if (!window.__menuState || !window.__menuState.items) return;
    window.__menuState.items.forEach(m => {
      if (!Array.isArray(m.media) || !m.media.length) return;
      const node = list.querySelector(`[data-go="menu"][data-id="${m.id}"]`);
      if (!node || node.dataset.enhanced) return;
      node.dataset.enhanced = '1';
      const wrap = document.createElement('div');
      wrap.style.cssText = 'background:rgba(255,255,255,.02);border-bottom:1px solid rgba(255,255,255,.04);padding:4px 0';
      wrap.innerHTML = m.media.map((x,i) => {
        const ic = ({video:'🎬',image:'🖼',audio:'🎵',pdf:'📄',embed:'🔗'})[x.type]||'•';
        return `<button class="dm-item" data-menu-media="${m.id}|${i}" style="padding:10px 24px 10px 48px;font-size:13px;background:transparent;border:none;width:100%;text-align:right;display:flex;gap:10px;align-items:center;color:#c8c8d0;cursor:pointer">
          <span style="width:22px;text-align:center">${ic}</span>
          <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.caption||x.title||x.url||'بدون عنوان')}</span>
        </button>`;
      }).join('');
      node.parentNode.insertBefore(wrap, node.nextSibling);
    });
  }
  // Re-run after openDrawer paints
  const _open = window.openDrawer;
  if (typeof _open === 'function') {
    window.openDrawer = function(){ const r = _open.apply(this, arguments); setTimeout(enhanceDrawer, 30); return r; };
  } else {
    // fallback: watch the drawer-list for changes
    const o = new MutationObserver(()=>setTimeout(enhanceDrawer, 10));
    document.addEventListener('DOMContentLoaded', () => {
      const list = document.getElementById('drawer-list');
      if (list) o.observe(list, { childList:true });
    });
  }

  // Click handler for menu-media items
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-menu-media]'); if (!b) return;
    const [mid, idx] = b.dataset.menuMedia.split('|');
    const m = window.__menuState && window.__menuState.items && window.__menuState.items.find(x=>x.id===mid);
    if (!m) return;
    const item = (m.media||[])[+idx]; if (!item) return;
    e.preventDefault(); e.stopPropagation();
    playSideMenuItem(item);
  });

  // Universal play for a media item
  window.playSideMenuItem = function(item){
    const type = item.type || 'audio';
    if (type === 'audio') {
      fap.open({ url:item.url, title:item.caption||item.title||'تشغيل', artist:'', cover:item.cover||item.thumb||'' });
      return;
    }
    if (type === 'image') {
      openImage(normalizeMediaUrl(item.url, { type:'image', mime:item.mime||'' }));
      return;
    }
    if (type === 'pdf') {
      openPdf(item.url, item.caption || item.title || 'PDF');
      return;
    }
    if (type === 'video' || type === 'embed') {
      const embed = getEmbedSrc(item.url);
      // Open a quick lightbox-style overlay
      let ov = document.getElementById('quick-vid');
      if (!ov) {
        ov = document.createElement('div'); ov.id='quick-vid';
        ov.style.cssText='position:fixed;inset:0;z-index:340;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:14px';
        ov.innerHTML='<button id="qv-close" style="position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;background:#1d1d27;color:#fff;border:none;cursor:pointer">✕</button><div id="qv-body" style="width:100%;max-width:960px;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden"></div>';
        document.body.appendChild(ov);
        ov.addEventListener('click', e => { if (e.target.id==='quick-vid' || e.target.id==='qv-close') { ov.style.display='none'; document.getElementById('qv-body').innerHTML=''; } });
      }
      const body = document.getElementById('qv-body');
      if (embed) {
        body.innerHTML = `<iframe src="${esc(embed)}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen style="width:100%;height:100%;border:0"></iframe>`;
      } else {
        const src = normalizeMediaUrl(item.url, { type:'video', mime:item.mime||'video/mp4' });
        body.innerHTML = `<video src="${esc(src)}" controls autoplay playsinline style="width:100%;height:100%;background:#000"></video>`;
      }
      ov.style.display='flex';
    }
  };
})();
